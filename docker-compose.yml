services:
  postgres:
    image: postgres:16-alpine
    container_name: cliste-postgres
    environment:
      POSTGRES_DB: cliste
      POSTGRES_USER: cliste
      POSTGRES_PASSWORD: cliste
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cliste-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliste -d cliste"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cliste-postgres-data:
